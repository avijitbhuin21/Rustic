# cargo-audit config (picked up automatically by `cargo audit`).
#
# Every ignore must say why the advisory is unreachable and when to drop it.

[advisories]
ignore = [
    # zip `ZipArchive::extract` / `ZipStreamReader::extract` advisories
    # (abort on large symlink entry, SUID/SGID kept, symlink escape, perms through
    # symlinks). Our own `zip` dependency is 9.x and fixed; two transitive copies
    # remain on old majors because no upstream release has moved yet:
    #   - zip 8.6.0 via docx-rs 0.4.22 (latest): reads entries into memory only,
    #     never calls `extract`.
    #   - zip 4.6.1 via tauri-plugin-updater 2.10.1 (latest 2.x; 3.x is alpha):
    #     calls `extract` only on Windows update bundles, after the minisign
    #     signature over the downloaded bytes has been verified against our pubkey,
    #     so the archive is never attacker-controlled.
    # Drop these once docx-rs and tauri-plugin-updater ship on zip >= 9.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0429",
]
