name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch — saves CI minutes when pushing
# rapidly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust (cargo check + test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          # Keep in sync with rust-toolchain.toml at the repo root. dtolnay's
          # @stable sets RUSTUP_TOOLCHAIN, which would override the toolchain
          # file and let CI drift from local builds.
          toolchain: "1.91.0"
          components: clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ". -> target"

      # Tauri 2 build deps on Windows are bundled with the toolchain — nothing
      # extra needed here. On Linux we'd install webkit2gtk + libsoup.

      - name: cargo check (workspace)
        run: cargo check --workspace --locked

      - name: cargo test (workspace, lib)
        run: cargo test --workspace --lib --locked

      # Lint with clippy. Deny-level workspace lints (dbg_macro,
      # await_holding_lock) fail the build; advisory lints (unwrap_used /
      # expect_used are deliberately `warn` in the workspace lint table) stay
      # warnings — RUSTFLAGS is cleared here so the global `-D warnings`
      # doesn't promote them and defeat that policy.
      - name: cargo clippy
        run: cargo clippy --workspace --lib --locked
        env:
          RUSTFLAGS: ""

  server:
    name: Rust (rustic-server, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.91.0"

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ". -> target"

      # The server crate links no webview, so no webkit2gtk/libsoup needed.
      - name: cargo check (rustic-server)
        run: cargo check -p rustic-server --locked

  fmt:
    name: Rust (cargo fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.91.0"
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all --check

  audit:
    name: Rust (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.91.0"

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Scan Cargo.lock for RustSec advisories (vulns + unmaintained/yanked).
      - name: cargo audit
        run: cargo audit

  licenses:
    name: Rust (cargo deny — licences)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Fails the build on a copyleft (GPL / AGPL / LGPL-only) dependency:
      # Rustic ships binaries with no LICENSE file, so one cannot be linked in.
      # Policy lives in deny.toml; advisories stay with the cargo audit job.
      - name: cargo deny (licences + sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check licenses sources

  frontend:
    name: Frontend (bun build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: bun install
        run: bun install --frozen-lockfile

      - name: bun run build
        run: bun run build
