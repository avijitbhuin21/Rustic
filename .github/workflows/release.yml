name: Release

# Builds Rustic for Windows, macOS (Apple Silicon + Intel) and Linux, signs the
# updater artifacts, and uploads everything to ONE draft GitHub Release whose
# latest.json lists every platform — the in-app updater polls it via the
# endpoint in tauri.conf.json. Publish the draft once every job is green (the
# updater only sees published releases, so a partial build never ships).
#
# Triggers:
#   - pushing a version tag (v0.6.0, v1.0.0, ...)
#   - manual dispatch (Actions tab → Release → Run workflow) for re-runs
#     when the tag already exists (e.g. the workflow landed after the tag).
#
# Required repo secrets:
#   TAURI_SIGNING_PRIVATE_KEY           — contents of .updater-signing.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — its password (omit if none)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to (re)build: all, or a comma list of windows, macos-arm, macos-intel, linux'
        required: false
        default: 'all'

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build & upload (${{ matrix.name }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            key: windows
            platform: windows-latest
            args: ''
            rust_targets: ''
          - name: macOS (Apple Silicon)
            key: macos-arm
            platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_targets: 'aarch64-apple-darwin'
          - name: macOS (Intel)
            key: macos-intel
            platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust_targets: 'x86_64-apple-darwin'
          - name: Linux
            key: linux
            platform: ubuntu-22.04
            args: ''
            rust_targets: ''
    runs-on: ${{ matrix.platform }}
    env:
      # Tag pushes build everything; a manual run can rebuild just the
      # platforms listed in the `platforms` input (the others skip every step).
      SELECTED: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || contains(inputs.platforms, matrix.key) }}
      # The Vite build exceeds Node's default heap on the macOS runners.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        if: env.SELECTED == 'true'

      - name: Check signing secret
        if: env.SELECTED == 'true'
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is missing or empty; installed apps could not verify this update."
            exit 1
          fi
          echo "Signing key secret present."

      - name: Install Linux system dependencies
        if: env.SELECTED == 'true' && matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev pkg-config

      - name: Install Rust (pinned)
        if: env.SELECTED == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          # Keep in sync with rust-toolchain.toml and ci.yml. @stable would set
          # RUSTUP_TOOLCHAIN and override the toolchain file, so a release
          # could be built on a compiler CI never tested.
          toolchain: "1.91.0"
          targets: ${{ matrix.rust_targets }}

      - name: Cache cargo + target
        if: env.SELECTED == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.rust_targets }}

      - name: Install Bun
        if: env.SELECTED == 'true'
        uses: oven-sh/setup-bun@v2

      - name: bun install
        if: env.SELECTED == 'true'
        run: bun install --frozen-lockfile

      - name: Build and upload to the draft release
        if: env.SELECTED == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun run tauri
          args: ${{ matrix.args }}
          tagName: v__VERSION__
          releaseName: 'Rustic v__VERSION__'
          releaseBody: 'Downloads for Windows, macOS (Apple Silicon and Intel) and Linux are in the assets below. The macOS build is not notarized yet: on first launch, right-click the app and choose Open.'
          releaseDraft: true
          prerelease: false
