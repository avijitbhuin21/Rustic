[package]
name = "rustic"
version = "0.8.6"
edition = "2021"
publish = false

[lib]
name = "rustic_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# The web inspector is opt-in. Release bundles (CI and local) ship without it;
# debug builds (`tauri dev`, `tauri build --debug`) always have it because
# Tauri enables it under debug assertions. For a release build that keeps the
# inspector: `bun run tauri build --features devtools`.
default = []
devtools = ["tauri/devtools"]

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
# `zip` (default) only unpacks v1-style `.msi.zip` / `.AppImage.tar.gz` bundles;
# `createUpdaterArtifacts: true` ships raw installers, so it is off (drops zip 4).
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls"] }
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
sha2 = "0.10"
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "io-util", "time", "fs", "process", "net", "signal"] }
reqwest = { workspace = true }
zip = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
form_urlencoded = { workspace = true }
base64 = { workspace = true }
# keyring v3 ships with NO backend features by default — without one, Entry::new
# falls back to a mock store that silently accepts writes and returns NoEntry on
# reads, so configured API keys vanish across launches. Enable the per-platform
# native backend so secrets actually persist (Windows Credential Manager, macOS
# Keychain, Linux libsecret via D-Bus).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
# P1.8: needed to convert the goal-loop's String-error termination back to
# the anyhow::Error type the rest of send_message threads through.
anyhow = { workspace = true }

rustic-app = { workspace = true }
rustic-core = { workspace = true }
rustic-db = { workspace = true }
rustic-agent = { workspace = true }
ignore = { workspace = true }

rustic-git = { workspace = true }
rustic-terminal = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Already in the tree via tauri/tao; used for the borderless window's simple-fullscreen chrome.
objc2 = "0.6"

[lints]
workspace = true
